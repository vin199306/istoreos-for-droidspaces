name: Build & Release iStoreOS rootfs.tar.gz for Droidspaces
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y qemu-utils gzip kpartx
          sudo modprobe nbd max_part=16

      - name: Set environment variables
        run: |
          echo "IMG_URL=https://dl.istoreos.com/iStoreOS/armsr/istoreos-24.10.7-2026060510-armsr-squashfs-combined-efi.img.gz" >> $GITHUB_ENV
          echo "IMG_GZ=istoreos.img.gz" >> $GITHUB_ENV
          echo "IMG_RAW=istoreos.img" >> $GITHUB_ENV
          echo "SYS_MNT=./sys_mnt" >> $GITHUB_ENV
          echo "RW_ROOT=./rw_root" >> $GITHUB_ENV
          echo "OUT_TAR=./rootfs.tar.gz" >> $GITHUB_ENV
          echo "RELEASE_TAG=latest" >> $GITHUB_ENV

      - name: Create dirs
        run: |
          mkdir -p ./sys_mnt ./rw_root

      - name: Download image
        run: |
          if [ -f "${{ env.IMG_GZ }}" ]; then
            echo "✅ 文件已存在，跳过下载"
          else
            echo "🔽 开始下载镜像"
            wget -c --retry-connrefused --tries=3 --timeout=10 "${{ env.IMG_URL }}" -O "${{ env.IMG_GZ }}"
          fi

      - name: Decompress image
        run: |
          zcat "${{ env.IMG_GZ }}" > "${{ env.IMG_RAW }}" || true

      - name: Mount read-only system partition nbd0p2
        run: |
          sudo qemu-nbd -f raw -c /dev/nbd0 "${{ env.IMG_RAW }}"
          sleep 3
          sudo kpartx -av /dev/nbd0
          sudo mount /dev/mapper/nbd0p2 "${{ env.SYS_MNT }}"
          echo "=== 检查 /sbin/init ==="
          ls -la "${{ env.SYS_MNT }}/sbin/init"

      # 拷贝只读分区内容到可读写目录
      - name: Copy to writable directory
        run: |
          sudo cp -a "${{ env.SYS_MNT }}"/* "${{ env.RW_ROOT }}/"

      # 完整修复 run 相关目录、软链接、droidspaces 子目录
      - name: Fix run dir & droidspaces subdirs
        run: |
          cd "${{ env.RW_ROOT }}"
          # 基础目录
          sudo mkdir -p tmp/run
          sudo rm -f run
          sudo ln -sf tmp/run run
          # 补充 Droidspaces 必需目录
          sudo mkdir -p run/droidspaces/vproc
          # 设置合理权限
          sudo chmod 755 run tmp/run run/droidspaces run/droidspaces/vproc

      # 打包（保留权限、软链接）
      - name: Package to rootfs.tar.gz
        run: |
          cd "${{ env.RW_ROOT }}"
          sudo tar --preserve-permissions -zcvf ../rootfs.tar.gz .

      # 统一清理设备与挂载
      - name: Full cleanup
        if: always()
        run: |
          sudo umount "${{ env.SYS_MNT }}" 2>/dev/null || true
          sudo kpartx -dv /dev/nbd0 2>/dev/null || true
          sudo qemu-nbd -d /dev/nbd0 2>/dev/null || true
          sudo rmmod nbd 2>/dev/null || true

      # 上传到 GitHub Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: iStoreOS rootfs.tar.gz for Droidspaces
          body: 补齐 /run/droidspaces/vproc 目录，修复 Droidspaces 启动依赖
          files: |
            ./rootfs.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
