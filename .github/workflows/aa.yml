name: Build iStoreOS arm64 rootfs.img for Droidspaces
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y qemu-utils gzip kpartx e2fsprogs
          sudo modprobe nbd max_part=16

      - name: Set env
        run: |
          echo "IMG_URL=https://fw.d4ctech.com/iStoreOS/armsr/istoreos-24.10.7-2026060510-armsr-squashfs-combined-efi.img.gz" >> $GITHUB_ENV
          echo "IMG_GZ=istoreos.img.gz" >> $GITHUB_ENV
          echo "IMG_RAW=istoreos.img" >> $GITHUB_ENV
          echo "MNT_DIR=./mnt_all" >> $GITHUB_ENV
          echo "EXT4_MNT=./ext4_mnt" >> $GITHUB_ENV
          echo "OUT_IMG=./rootfs.img" >> $GITHUB_ENV

      - name: Create dirs
        run: |
          mkdir -p ./mnt_all ./ext4_mnt

      - name: Download image
        run: |
          if [ -f "${{ env.IMG_GZ }}" ]; then
            echo "✅ File exists, skip download"
          else
            echo "🔽 Downloading image..."
            wget -c --retry-connrefused --tries=3 --timeout=10 "${{ env.IMG_URL }}" -O "${{ env.IMG_GZ }}"
          fi

      - name: Decompress image
        run: |
          zcat "${{ env.IMG_GZ }}" > "${{ env.IMG_RAW }}" || true

      # 挂载整个镜像，遍历所有分区，找到包含 /sbin/init 的分区
      - name: Scan all partitions
        run: |
          sudo qemu-nbd -f raw -c /dev/nbd0 "${{ env.IMG_RAW }}"
          sleep 3
          sudo kpartx -av /dev/nbd0
          echo "==== All partitions ===="
          ls -l /dev/mapper/

          # 逐个测试分区
          for part in nbd0p1 nbd0p2 nbd0p3 nbd0p128; do
            echo -e "\n==== Test partition: $part ===="
            sudo mount /dev/mapper/$part "${{ env.MNT_DIR }}" 2>/dev/null
            ls -la "${{ env.MNT_DIR }}"
            if [ -f "${{ env.MNT_DIR }}/sbin/init" ]; then
              echo "✅ Found valid rootfs on $part"
              echo "TARGET_PART=$part" >> $GITHUB_ENV
              break
            fi
            sudo umount "${{ env.MNT_DIR }}" 2>/dev/null
          done

          if [ -z "${{ env.TARGET_PART }}" ]; then
            echo "❌ No valid rootfs partition found!"
            exit 1
          fi

      # 制作 1.5G ext4 镜像
      - name: Create ext4 rootfs.img
        run: |
          dd if=/dev/zero of="${{ env.OUT_IMG }}" bs=1M count=1536 status=none
          mkfs.ext4 -F "${{ env.OUT_IMG }}"

      # 复制系统文件到 ext4 镜像
      - name: Copy rootfs files
        run: |
          sudo mount -o loop "${{ env.OUT_IMG }}" "${{ env.EXT4_MNT }}"
          sudo cp -a "${{ env.MNT_DIR }}"/* "${{ env.EXT4_MNT }}/"

      # 全局强制清理
      - name: Cleanup
        if: always()
        run: |
          sudo umount "${{ env.EXT4_MNT }}" 2>/dev/null || true
          sudo umount "${{ env.MNT_DIR }}" 2>/dev/null || true
          sudo kpartx -dv /dev/nbd0 2>/dev/null || true
          sudo qemu-nbd -d /dev/nbd0 2>/dev/null || true
          sudo rmmod nbd 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-droid-rootfs-img
          path: ./rootfs.img
          retention-days: 30
