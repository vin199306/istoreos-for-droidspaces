name: Build iStoreOS arm64 rootfs

# 触发方式：手动点击运行 / 推送代码触发
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y qemu-utils gzip kpartx
          sudo modprobe nbd max_part=16

      - name: Create work dir
        run: |
          mkdir -p /opt/istoreos-work
          cd /opt/istoreos-work

      - name: Download & Decompress image
        run: |
          cd /opt/istoreos-work
          IMG_URL="https://fw20.koolcenter.com/iStoreOS/armsr/istoreos-24.10.7-2026060510-armsr-squashfs-combined-efi.img.gz"
          
          # 1. 带重试的下载（失败自动重试3次）
          wget -c --retry-connrefused --tries=3 "${IMG_URL}" -O istoreos.img.gz.tmp
          mv istoreos.img.gz.tmp istoreos.img.gz
      
          # 2. 先校验文件完整性（可选但强烈推荐）
          # 你可以从 iStoreOS 官网找到对应镜像的 sha256sum，替换下面的字符串
          # echo "你的sha256值  istoreos.img.gz" | sha256sum -c -
      
          # 3. 安全解压（即使有trailing garbage也能解压出有效部分）
          gunzip -c istoreos.img.gz > istoreos.img
          ls -lh istoreos.img

      - name: Map image to NBD device
        run: |
          cd /opt/istoreos-work
          sudo qemu-nbd -c /dev/nbd0 istoreos.img
          sleep 2
          sudo kpartx -av /dev/nbd0

      - name: Mount root partition
        run: |
          sudo mkdir -p /mnt/istoreos
          # iStoreOS 标准分区为 nbd0p1
          sudo mount /dev/mapper/nbd0p1 /mnt/istoreos

      - name: Package rootfs.tar.gz (exclude virtual dirs)
        run: |
          cd /mnt/istoreos
          sudo tar --create --gzip \
            --exclude='dev/*' \
            --exclude='proc/*' \
            --exclude='sys/*' \
            --exclude='tmp/*' \
            --exclude='run/*' \
            --exclude='lost+found' \
            -f /opt/istoreos-work/istoreos-arm64-rootfs.tar.gz .
          ls -lh /opt/istoreos-work/

      - name: Unmount & cleanup NBD
        run: |
          sudo umount /mnt/istoreos
          sudo kpartx -dv /dev/nbd0
          sudo qemu-nbd -d /dev/nbd0
          sudo rmmod nbd || true

      - name: Upload rootfs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-arm64-rootfs
          path: /opt/istoreos-work/istoreos-arm64-rootfs.tar.gz
          retention-days: 30
