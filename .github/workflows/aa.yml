name: Build iStoreOS arm64 rootfs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y qemu-utils gzip kpartx
          sudo modprobe nbd max_part=16

      - name: Create work dir
        run: |
          sudo mkdir -p /opt/istoreos-work
          cd /opt/istoreos-work

      - name: Set image URL env
        run: |
          echo "IMG_URL=https://fw20.koolcenter.com/iStoreOS/armsr/istoreos-24.10.7-2026060510-armsr-squashfs-combined-efi.img.gz" >> $GITHUB_ENV

      # 缓存压缩包
      - name: Cache image archive
        uses: actions/cache@v4
        with:
          path: /opt/istoreos-work/istoreos.img.gz
          key: istoreos-armsr-${{ env.IMG_URL }}
          restore-keys: istoreos-armsr-

      - name: Download image
        run: |
          cd /opt/istoreos-work
          if [ ! -f istoreos.img.gz ]; then
            echo "Cache miss, downloading..."
            wget -c --retry-connrefused --tries=3 --timeout=10 "${{ env.IMG_URL }}" -O istoreos.img.gz
          else
            echo "Use cached image"
          fi

      # 解压镜像
      - name: Decompress gz image
        run: |
          cd /opt/istoreos-work
          zcat istoreos.img.gz > istoreos.img || true
          ls -lh istoreos.img

      # 关键修复：显式指定 -f raw 格式
      - name: Map & mount root partition
        run: |
          cd /opt/istoreos-work
          # 增加 -f raw 声明镜像格式，消除报错
          sudo qemu-nbd -f raw -c /dev/nbd0 istoreos.img
          sleep 2
          sudo kpartx -av /dev/nbd0
          sudo mkdir -p /mnt/istoreos
          sudo mount /dev/mapper/nbd0p1 /mnt/istoreos

      # 打包 rootfs
      - name: Package rootfs.tar.gz
        run: |
          cd /mnt/istoreos
          sudo tar czf /opt/istoreos-work/istoreos-arm64-rootfs.tar.gz \
            --exclude='dev/*' \
            --exclude='proc/*' \
            --exclude='sys/*' \
            --exclude='tmp/*' \
            --exclude='run/*' \
            --exclude='lost+found' \
            .
          ls -lh /opt/istoreos-work/

      # 强制清理
      - name: Cleanup
        if: always()
        run: |
          sudo umount /mnt/istoreos 2>/dev/null || true
          sudo kpartx -dv /dev/nbd0 2>/dev/null || true
          sudo qemu-nbd -d /dev/nbd0 2>/dev/null || true
          sudo rmmod nbd 2>/dev/null || true

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-arm64-rootfs
          path: /opt/istoreos-work/istoreos-arm64-rootfs.tar.gz
          retention-days: 30
