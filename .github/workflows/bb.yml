name: Build iStoreOS RootFS (tar.gz) for DroidSpaces
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 0'

env:
  TARGET_ARCH: aarch64
  ROOTFS_NAME: istoreos-droidspaces-rootfs-${{ github.run_id }}.tar.gz
  BUILD_DIR: /opt/istoreos-build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential libncurses-dev gawk flex bison \
            git python3 python3-pip unzip wget curl rsync \
            libssl-dev qemu-utils fakeroot kmod \
            tar gzip file

      - name: Clone iStoreOS-ARM source
        run: |
          sudo mkdir -p ${{ env.BUILD_DIR }}
          sudo chown $USER:$USER ${{ env.BUILD_DIR }}
          cd ${{ env.BUILD_DIR }}
          git clone --depth 1 https://github.com/Arthur97172/iStoreOS-ARM.git .

      - name: Update feeds & install packages
        run: |
          cd ${{ env.BUILD_DIR }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate default config (aarch64)
        run: |
          cd ${{ env.BUILD_DIR }}
          # 生成对应架构默认配置
          make defconfig

      - name: Build rootfs only (no firmware)
        run: |
          cd ${{ env.BUILD_DIR }}
          # 仅编译根文件系统，不编译内核/固件
          make -j$(nproc) V=s rootfs

      - name: Package rootfs to tar.gz
        run: |
          cd ${{ env.BUILD_DIR }}
          # OpenWrt 编译产物默认输出路径
          OUT_ROOTFS=$(find bin/targets/ -name "rootfs.tar.gz" | head -n1)
          mv ${OUT_ROOTFS} ./${{ env.ROOTFS_NAME }}
          ls -lh ./${{ env.ROOTFS_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ROOTFS_NAME }}
          path: ${{ env.BUILD_DIR }}/${{ env.ROOTFS_NAME }}
          retention-days: 30
