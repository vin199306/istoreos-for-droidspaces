name: Build iStoreOS arm64 rootfs for Droidspaces

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          # 新增 squashfs-tools 用于解压 root.squashfs
          sudo apt install -y qemu-utils gzip kpartx squashfs-tools
          sudo modprobe nbd max_part=16

      - name: Set env
        run: |
          echo "IMG_URL=https://fw20.koolcenter.com/iStoreOS/armsr/istoreos-24.10.7-2026060510-armsr-squashfs-combined-efi.img.gz" >> $GITHUB_ENV
          echo "WORK_DIR=${{ github.workspace }}/work" >> $GITHUB_ENV
          echo "SQUASH_MNT=${{ github.workspace }}/squash_mnt" >> $GITHUB_ENV

      - name: Create work dir
        run: |
          mkdir -p "${{ env.WORK_DIR }}"
          mkdir -p "${{ env.SQUASH_MNT }}"
          cd "${{ env.WORK_DIR }}"

      # 缓存镜像压缩包
      - name: Cache image archive
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/istoreos.img.gz
          key: istoreos-armsr-${{ hashText(env.IMG_URL) }}
          restore-keys: istoreos-armsr-

      - name: Download image
        run: |
          cd "${{ env.WORK_DIR }}"
          if [ -f "istoreos.img.gz" ]; then
            echo "✅ 缓存命中，跳过下载"
          else
            echo "🔽 缓存未命中，开始下载"
            wget -c --retry-connrefused --tries=3 --timeout=10 "${{ env.IMG_URL }}" -O istoreos.img.gz
          fi

      - name: Decompress image
        run: |
          cd "${{ env.WORK_DIR }}"
          zcat istoreos.img.gz > istoreos.img || true

      # 挂载磁盘分区
      - name: Map & mount partition
        run: |
          cd "${{ env.WORK_DIR }}"
          sudo qemu-nbd -f raw -c /dev/nbd0 istoreos.img
          sleep 2
          sudo kpartx -av /dev/nbd0
          sudo mkdir -p /mnt/istoreos
          sudo mount /dev/mapper/nbd0p1 /mnt/istoreos

      # 关键：解压内嵌 root.squashfs
      - name: Extract squashfs rootfs
        run: |
          cd "${{ env.WORK_DIR }}"
          # 解压 squashfs 到独立目录
          sudo unsquashfs -d "${{ env.SQUASH_MNT }}" /mnt/istoreos/root.squashfs
          # 校验是否存在 /sbin/init
          ls -lh "${{ env.SQUASH_MNT }}"/sbin/init

      # 打包标准 rootfs（从 squashfs 解压目录打包）
      - name: Package valid rootfs.tar.gz
        run: |
          cd "${{ env.SQUASH_MNT }}"
          sudo tar czf "${{ env.WORK_DIR }}/istoreos-droid-rootfs.tar.gz" \
            --exclude='dev/*' \
            --exclude='proc/*' \
            --exclude='sys/*' \
            --exclude='tmp/*' \
            --exclude='run/*' \
            --exclude='lost+found' \
            .
          ls -lh "${{ env.WORK_DIR }}"

      # 全局清理
      - name: Cleanup
        if: always()
        run: |
          sudo umount /mnt/istoreos 2>/dev/null || true
          sudo kpartx -dv /dev/nbd0 2>/dev/null || true
          sudo qemu-nbd -d /dev/nbd0 2>/dev/null || true
          sudo rmmod nbd 2>/dev/null || true

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-droid-rootfs
          path: ${{ env.WORK_DIR }}/istoreos-droid-rootfs.tar.gz
          retention-days: 30
