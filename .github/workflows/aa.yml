name: Build iStoreOS arm64 rootfs.img for Droidspaces
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y qemu-utils gzip kpartx e2fsprogs
          sudo modprobe nbd max_part=16

      - name: Set env
        run: |
          echo "IMG_URL=https://dl.istoreos.com/iStoreOS/armsr/istoreos-24.10.7-2026060510-armsr-squashfs-combined-efi.img.gz" >> $GITHUB_ENV
          echo "IMG_GZ=istoreos.img.gz" >> $GITHUB_ENV
          echo "IMG_RAW=istoreos.img" >> $GITHUB_ENV
          echo "SYS_MNT=./sys_mnt" >> $GITHUB_ENV
          echo "EXT4_MNT=./ext4_mnt" >> $GITHUB_ENV
          echo "OUT_IMG=./rootfs.img" >> $GITHUB_ENV

      - name: Create dirs
        run: |
          mkdir -p ./sys_mnt ./ext4_mnt

      - name: Download image
        run: |
          if [ -f "${{ env.IMG_GZ }}" ]; then
            echo "✅ 文件已存在，跳过下载"
          else
            echo "🔽 开始下载镜像"
            wget -c --retry-connrefused --tries=3 --timeout=10 "${{ env.IMG_URL }}" -O "${{ env.IMG_GZ }}"
          fi

      - name: Decompress image
        run: |
          zcat "${{ env.IMG_GZ }}" > "${{ env.IMG_RAW }}" || true

      # 锁定 nbd0p2 为系统分区
      - name: Mount system partition nbd0p2
        run: |
          sudo qemu-nbd -f raw -c /dev/nbd0 "${{ env.IMG_RAW }}"
          sleep 3
          sudo kpartx -av /dev/nbd0
          echo "=== 挂载系统分区 nbd0p2 ==="
          sudo mount /dev/mapper/nbd0p2 "${{ env.SYS_MNT }}"
          echo "=== 检查 /sbin/init ==="
          ls -la "${{ env.SYS_MNT }}/sbin/init"

      # 生成 1.5G ext4 镜像
      - name: Create ext4 rootfs.img
        run: |
          dd if=/dev/zero of="${{ env.OUT_IMG }}" bs=1M count=1536 status=none
          mkfs.ext4 -F "${{ env.OUT_IMG }}"

      # 完整复制系统文件
      - name: Copy files to ext4
        run: |
          sudo mount -o loop "${{ env.OUT_IMG }}" "${{ env.EXT4_MNT }}"
          sudo cp -a "${{ env.SYS_MNT }}"/* "${{ env.EXT4_MNT }}/"

      # 强制清理所有挂载与设备
      - name: Full cleanup
        if: always()
        run: |
          sudo umount "${{ env.EXT4_MNT }}" 2>/dev/null || true
          sudo umount "${{ env.SYS_MNT }}" 2>/dev/null || true
          sudo kpartx -dv /dev/nbd0 2>/dev/null || true
          sudo qemu-nbd -d /dev/nbd0 2>/dev/null || true
          sudo rmmod nbd 2>/dev/null || true

      - name: Upload rootfs.img
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-droid-rootfs-img
          path: ./rootfs.img
          retention-days: 30
