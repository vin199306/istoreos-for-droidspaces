name: Build iStoreOS arm64 rootfs.img for Droidspaces

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y qemu-utils gzip kpartx e2fsprogs
          sudo modprobe nbd max_part=16

      - name: Set environment variables
        run: |
          echo "IMG_URL=https://fw20.koolcenter.com/iStoreOS/armsr/istoreos-24.10.7-2026060510-armsr-squashfs-combined-efi.img.gz" >> $GITHUB_ENV
          echo "IMG_GZ=istoreos.img.gz" >> $GITHUB_ENV
          echo "IMG_RAW=istoreos.img" >> $GITHUB_ENV
          echo "ISTORE_MNT=./istore_mnt" >> $GITHUB_ENV
          echo "EXT4_MNT=./ext4_mnt" >> $GITHUB_ENV
          echo "OUT_IMG=./rootfs.img" >> $GITHUB_ENV

      - name: Create folders
        run: |
          mkdir -p ./istore_mnt ./ext4_mnt

      - name: Download image
        run: |
          if [ -f "${{ env.IMG_GZ }}" ]; then
            echo "✅ 文件已存在，跳过下载"
          else
            echo "🔽 开始下载镜像"
            wget -c --retry-connrefused --tries=3 --timeout=10 "${{ env.IMG_URL }}" -O "${{ env.IMG_GZ }}"
          fi

      - name: Decompress gz to raw image
        run: |
          zcat "${{ env.IMG_GZ }}" > "${{ env.IMG_RAW }}" || true

      - name: Mount raw image partition
        run: |
          sudo qemu-nbd -f raw -c /dev/nbd0 "${{ env.IMG_RAW }}"
          sleep 3
          sudo kpartx -av /dev/nbd0
          echo "=== 分区列表 ==="
          ls -l /dev/mapper/
          # 核心修正：挂载 nbd0p3 系统分区，而非 nbd0p1
          sudo mount /dev/mapper/nbd0p3 "${{ env.ISTORE_MNT }}"
          echo "=== 分区内文件列表 ==="
          ls -la "${{ env.ISTORE_MNT }}/"
          echo "=== 检查启动文件 /sbin/init ==="
          ls -la "${{ env.ISTORE_MNT }}/sbin/init"

      - name: Create 1.5G ext4 rootfs.img
        run: |
          dd if=/dev/zero of="${{ env.OUT_IMG }}" bs=1M count=1536 status=none
          mkfs.ext4 -F "${{ env.OUT_IMG }}"

      - name: Copy all files to ext4 image
        run: |
          sudo mount -o loop "${{ env.OUT_IMG }}" "${{ env.EXT4_MNT }}"
          sudo cp -a "${{ env.ISTORE_MNT }}"/* "${{ env.EXT4_MNT }}/"

      - name: Full cleanup
        if: always()
        run: |
          sudo umount "${{ env.EXT4_MNT }}" 2>/dev/null || true
          sudo umount "${{ env.ISTORE_MNT }}" 2>/dev/null || true
          sudo kpartx -dv /dev/nbd0 2>/dev/null || true
          sudo qemu-nbd -d /dev/nbd0 2>/dev/null || true
          sudo rmmod nbd 2>/dev/null || true

      - name: Upload rootfs.img
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-droid-rootfs-img
          path: ./rootfs.img
          retention-days: 30
