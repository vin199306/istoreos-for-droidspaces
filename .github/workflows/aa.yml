name: Build & Release iStoreOS rootfs.tar.gz for Droidspaces
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y qemu-utils gzip kpartx
          sudo modprobe nbd max_part=16

      - name: Set environment variables
        run: |
          echo "IMG_URL=https://dl.istoreos.com/iStoreOS/armsr/istoreos-24.10.7-2026060510-armsr-squashfs-combined-efi.img.gz" >> $GITHUB_ENV
          echo "IMG_GZ=istoreos.img.gz" >> $GITHUB_ENV
          echo "IMG_RAW=istoreos.img" >> $GITHUB_ENV
          echo "SYS_MNT=./sys_mnt" >> $GITHUB_ENV
          echo "OUT_TAR=./rootfs.tar.gz" >> $GITHUB_ENV
          echo "RELEASE_TAG=latest" >> $GITHUB_ENV

      - name: Create dirs
        run: |
          mkdir -p ./sys_mnt

      - name: Download image
        run: |
          if [ -f "${{ env.IMG_GZ }}" ]; then
            echo "✅ 文件已存在，跳过下载"
          else
            echo "🔽 开始下载镜像"
            wget -c --retry-connrefused --tries=3 --timeout=10 "${{ env.IMG_URL }}" -O "${{ env.IMG_GZ }}"
          fi

      - name: Decompress image
        run: |
          zcat "${{ env.IMG_GZ }}" > "${{ env.IMG_RAW }}" || true

      - name: Mount system partition nbd0p2
        run: |
          sudo qemu-nbd -f raw -c /dev/nbd0 "${{ env.IMG_RAW }}"
          sleep 3
          sudo kpartx -av /dev/nbd0
          sudo mount /dev/mapper/nbd0p2 "${{ env.SYS_MNT }}"
          echo "=== 检查 /sbin/init ==="
          ls -la "${{ env.SYS_MNT }}/sbin/init"

      # 打包为标准 rootfs.tar.gz（保留权限、软链接）
      - name: Package to tar.gz
        run: |
          cd "${{ env.SYS_MNT }}"
          sudo tar -zcvf ../rootfs.tar.gz .

      - name: Full cleanup
        if: always()
        run: |
          sudo umount "${{ env.SYS_MNT }}" 2>/dev/null || true
          sudo kpartx -dv /dev/nbd0 2>/dev/null || true
          sudo qemu-nbd -d /dev/nbd0 2>/dev/null || true
          sudo rmmod nbd 2>/dev/null || true

      # 上传 tar.gz 到 GitHub Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: iStoreOS rootfs.tar.gz for Droidspaces
          body: 标准 Linux 根文件系统 tar.gz 压缩包，适配 Droidspaces
          files: |
            ./rootfs.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
