name: Build iStoreOS Rootfs for DroidSpaces
on:
  workflow_dispatch: # 手动触发构建
  schedule:
    - cron: '0 0 * * 0' # 每周日自动构建

env:
  TARGET_ARCH: arm64
  ROOTFS_NAME: istoreos-rootfs-droidspaces-${{ github.run_id }}.tar.gz
  WORK_DIR: /tmp/istoreos-build

jobs:
  build-rootfs:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖工具
        run: |
          sudo apt update && sudo apt install -y \
            debootstrap qemu-user-static binfmt-support \
            tar gzip rsync wget curl sudo git \
            squashfs-tools fakeroot build-essential

      - name: 初始化rootfs基础目录
        run: |
          mkdir -p ${{ env.WORK_DIR }}/rootfs
          sudo debootstrap --arch=${{ env.TARGET_ARCH }} \
            --foreign \
            sid \
            ${{ env.WORK_DIR }}/rootfs \
            http://deb.debian.org/debian

      - name: 配置iStoreOS源与依赖
        run: |
          sudo cp /usr/bin/qemu-${{ env.TARGET_ARCH }}-static ${{ env.WORK_DIR }}/rootfs/usr/bin/
          sudo chroot ${{ env.WORK_DIR }}/rootfs /debootstrap/debootstrap --second-stage

          sudo tee ${{ env.WORK_DIR }}/rootfs/etc/apt/sources.list.d/istoreos.list > /dev/null << EOF
          deb https://fw.koolcenter.com/binary/istoreos/ stable main
          EOF

          sudo chroot ${{ env.WORK_DIR }}/rootfs /bin/bash -c "
            apt update && apt install -y --no-install-recommends \
              istoreos-core istoreos-webui istoreos-utils \
              openssh-server iproute2 dhcpcd5 iptables \
              kmod mount util-linux procps nginx;
            apt clean;
            rm -rf /var/lib/apt/lists/*;
          "

      - name: 适配DroidSpaces环境
        run: |
          sudo mkdir -p ${{ env.WORK_DIR }}/rootfs/mnt/sdcard ${{ env.WORK_DIR }}/rootfs/dev ${{ env.WORK_DIR }}/rootfs/proc ${{ env.WORK_DIR }}/rootfs/sys
          sudo touch ${{ env.WORK_DIR }}/rootfs/etc/fstab
          sudo tee -a ${{ env.WORK_DIR }}/rootfs/etc/fstab > /dev/null << EOF
          proc /proc proc defaults 0 0
          sysfs /sys sysfs defaults 0 0
          tmpfs /tmp tmpfs defaults 0 0
          /dev/block/mmcblk0p1 /mnt/sdcard vfat defaults 0 0
          EOF

          sudo chroot ${{ env.WORK_DIR }}/rootfs /bin/bash -c "
            systemctl disable systemd-resolved.service;
            systemctl disable NetworkManager.service;
            systemctl enable ssh.service;
            systemctl enable nginx.service;
          "

          sudo mkdir -p ${{ env.WORK_DIR }}/rootfs/root/.ssh
          sudo tee ${{ env.WORK_DIR }}/rootfs/root/.ssh/authorized_keys > /dev/null << EOF
          # 在此替换为你的 SSH 公钥
          EOF
          sudo chmod 700 ${{ env.WORK_DIR }}/rootfs/root/.ssh
          sudo chmod 600 ${{ env.WORK_DIR }}/rootfs/root/.ssh/authorized_keys

          sudo sed -i 's/192.168.1.1/192.168.43.1/g' ${{ env.WORK_DIR }}/rootfs/etc/config/network
          sudo sed -i 's/option disabled 1/option disabled 0/g' ${{ env.WORK_DIR }}/rootfs/etc/config/network

      - name: 打包为 tar.gz
        run: |
          cd ${{ env.WORK_DIR }}/rootfs
          sudo tar --exclude='./dev/*' \
                   --exclude='./proc/*' \
                   --exclude='./sys/*' \
                   --exclude='./tmp/*' \
                   -zcvf ../${{ env.ROOTFS_NAME }} .
          sudo chown $USER:$USER ../${{ env.ROOTFS_NAME }}

      # 已修复：使用 upload-artifact@v4 替代 v3
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-rootfs-droidspaces
          path: ${{ env.WORK_DIR }}/${{ env.ROOTFS_NAME }}
          retention-days: 30
