name: Build iStoreOS RootFS (tar.gz) for DroidSpaces
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 0'

env:
  TARGET_ARCH: aarch64
  ROOTFS_NAME: istoreos-droidspaces-rootfs-${{ github.run_id }}.tar.gz
  REPO_URL: https://github.com/Arthur97172/iStoreOS-ARM.git
  WORK_DIR: /opt/istoreos-build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential libncurses-dev gawk flex bison \
            git python3 python3-pip unzip wget curl rsync \
            libssl-dev qemu-utils fakeroot kmod \
            tar gzip file ca-certificates

      - name: 创建工作目录 & 拉取源码
        run: |
          sudo mkdir -p ${{ env.WORK_DIR }}
          sudo chown -R $USER:$USER ${{ env.WORK_DIR }}
          cd ${{ env.WORK_DIR }}
          # 克隆到子目录，避免目录混乱
          git clone --depth 1 ${{ env.REPO_URL }} source
          cd source
          ls -la

      - name: 初始化 feeds & 更新软件源
        run: |
          cd ${{ env.WORK_DIR }}/source
          chmod +x ./scripts/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成默认配置
        run: |
          cd ${{ env.WORK_DIR }}/source
          make defconfig

      - name: 编译 rootfs
        run: |
          cd ${{ env.WORK_DIR }}/source
          make -j$(nproc) V=s rootfs

      - name: 整理产物并打包
        run: |
          cd ${{ env.WORK_DIR }}/source
          # 查找编译输出的 rootfs.tar.gz
          find bin/ -name "rootfs.tar.gz"
          OUT_FILE=$(find bin/ -name "rootfs.tar.gz" | head -n1)
          cp ${OUT_FILE} ${{ env.WORK_DIR }}/${{ env.ROOTFS_NAME }}
          ls -lh ${{ env.WORK_DIR }}/${{ env.ROOTFS_NAME }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-rootfs
          path: ${{ env.WORK_DIR }}/${{ env.ROOTFS_NAME }}
          retention-days: 30
